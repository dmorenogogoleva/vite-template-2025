---
apiVersion: skaffold/v4beta8
kind: Config
metadata:
  name: client # You can specify any app name here
build:
  tagPolicy:
    sha256: {}
  artifacts:
  - image: registry.jetbrains.team/p/vibe-code-reviewing/containers/client # Must match you container image path from Space
    docker:
         buildArgs:
           WEBTEAM_UI_NPM_TOKEN: "{{.WEBTEAM_UI_NPM_TOKEN}}"
  local:
    useDockerCLI: false
    useBuildkit: true
deploy:
  helm:
    releases:
      - name: client
        remoteChart: oci://registry.jetbrains.team/p/cb/helm-charts/simple-app # You can leave it or specify any your helm chart or from your repo
        version: 0.2.0
        setValueTemplates:
          image: "{{.IMAGE_FULLY_QUALIFIED}}"
          imagePullSecret: "{{.IMAGE_PULL_SECRET}}"
          applicationName: "{{.APPLICATION_NAME}}"
        valuesFiles:
          - values.yaml